<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <link rel="icon" href="data:," />
  <title>App Tính Tổng</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: light dark;
      --bg: #eef1eb;
      --surface: #fbfcf8;
      --surface-2: #f1f4ed;
      --ink: #172019;
      --muted: #5f6b62;
      --line: #d4dbd2;
      --accent: #126a46;
      --accent-strong: #0a4f34;
      --accent-ink: #ffffff;
      --accent-soft: #dceee4;
      --result: #102a1e;
      --result-ink: #f2fff7;
      --result-muted: #acd0bb;
      --danger: #9e3f32;
      --cat: #c96c35;
      --cat-detail: #fff1df;
      --shadow: 0 20px 55px rgba(34, 54, 40, .10);
      --radius-lg: 24px;
      --radius-md: 14px;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0d1210;
        --surface: #151c18;
        --surface-2: #1b241e;
        --ink: #eef5f0;
        --muted: #a4b1a8;
        --line: #334038;
        --accent: #65d79e;
        --accent-strong: #8ce9b6;
        --accent-ink: #0d271a;
        --accent-soft: #183b2a;
        --result: #bde8cc;
        --result-ink: #0d271a;
        --result-muted: #315d45;
        --danger: #f09284;
        --cat: #f0a36d;
        --cat-detail: #29180e;
        --shadow: 0 20px 55px rgba(0, 0, 0, .28);
      }
    }

    * { box-sizing: border-box; }
    html { min-width: 0; font-size: 130%; }
    body {
      margin: 0;
      min-width: 0;
      min-height: 100vh;
      background:
        linear-gradient(90deg, color-mix(in srgb, var(--line) 35%, transparent) 1px, transparent 1px) 0 0 / 48px 48px,
        linear-gradient(color-mix(in srgb, var(--line) 35%, transparent) 1px, transparent 1px) 0 0 / 48px 48px,
        var(--bg);
      color: var(--ink);
      font-family: "Be Vietnam Pro", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    button, textarea, input { font: inherit; }
    button { color: inherit; }

    .page {
      width: min(1180px, 100%);
      margin: 0 auto;
      padding: clamp(22px, 4vw, 52px);
    }

    .intro {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      align-items: end;
      gap: 18px;
      margin-bottom: 24px;
    }

    .intro h1 {
      margin: 0;
      max-width: 700px;
      font-size: clamp(32px, 4.45vw, 64px);
      line-height: 1.02;
      letter-spacing: -.05em;
      font-weight: 700;
    }

    .hero-result[hidden] { display: none; }

    .hero-result {
      display: block;
      width: 100%;
      min-width: 0;
      margin: 0 0 6px;
      padding: 17px 22px;
      border-radius: 14px;
      background: #102a1e;
      color: #ffd84d;
      font: 600 clamp(2rem, 5.2vw, 3.1rem)/1 "IBM Plex Mono", monospace;
      letter-spacing: -.055em;
      text-align: center;
      font-variant-numeric: tabular-nums;
      overflow-wrap: anywhere;
    }

    .workspace {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
      align-items: stretch;
    }

    .panel {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .input-panel {
      padding: clamp(18px, 3vw, 28px);
      transition: border-color .22s, box-shadow .22s;
    }

    .input-panel:focus-within {
      border-color: color-mix(in srgb, var(--accent) 52%, var(--line));
      box-shadow: 0 20px 55px rgba(34, 54, 40, .10), 0 0 0 4px color-mix(in srgb, var(--accent) 10%, transparent);
    }

    .panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 14px;
    }

    .panel-head h2 {
      position: relative;
      margin: 0;
      padding-bottom: 7px;
      font-size: 1.18rem;
      line-height: 1.2;
      letter-spacing: -.025em;
    }

    .panel-head h2::after {
      content: "";
      position: absolute;
      left: 0;
      bottom: 0;
      width: 42px;
      height: 3px;
      border-radius: 3px;
      background: var(--accent);
      transform-origin: left;
      transition: width .22s ease;
    }

    .input-panel:focus-within .panel-head h2::after { width: 74px; }

    .panel-head-actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      flex: 0 0 auto;
    }

    textarea {
      display: block;
      width: 100%;
      min-height: 385px;
      resize: vertical;
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      background: var(--surface-2);
      color: var(--ink);
      padding: 20px;
      outline: none;
      line-height: 1.75;
      font-size: 1rem;
      caret-color: var(--accent);
      transition: border-color .18s, box-shadow .18s;
    }

    textarea::placeholder { color: color-mix(in srgb, var(--muted) 72%, transparent); }
    textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 14%, transparent);
    }

    .text-btn {
      flex: 0 0 auto;
      min-height: 40px;
      border: 0;
      background: transparent;
      color: var(--danger);
      font-size: .8rem;
      font-weight: 600;
      cursor: pointer;
      padding: 8px 6px;
    }

    .text-btn:hover,
    .text-btn:focus-visible {
      color: color-mix(in srgb, var(--danger) 78%, var(--ink));
      outline: none;
    }

    .result-panel {
      position: sticky;
      top: 22px;
      display: flex;
      flex-direction: column;
      background: var(--result);
      color: var(--result-ink);
      border: 0;
    }

    .total-block { padding: 26px 26px 22px; }
    .total-label {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      color: var(--result-muted);
      font-size: .78rem;
      font-weight: 600;
    }

    .auto-tools {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 7px;
    }

    .live-dot {
      display: inline-flex;
      align-items: center;
      gap: 7px;
    }

    .copy-orders-btn {
      min-height: 30px;
      padding: 5px 10px;
      border: 1px solid color-mix(in srgb, var(--result-ink) 24%, transparent);
      border-radius: 8px;
      background: color-mix(in srgb, var(--result-ink) 8%, transparent);
      color: var(--result-ink);
      font-size: .7rem;
      font-weight: 700;
      cursor: pointer;
    }

    .copy-orders-btn:hover,
    .copy-orders-btn:focus-visible {
      background: color-mix(in srgb, var(--result-ink) 15%, transparent);
      outline: none;
    }

    .copy-orders-btn:disabled {
      opacity: .42;
      cursor: default;
    }
    .live-dot::before {
      content: "";
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: currentColor;
      box-shadow: 0 0 0 4px color-mix(in srgb, currentColor 13%, transparent);
    }

    .total {
      margin: 16px 0 8px;
      font: 600 clamp(2rem, 5.2vw, 3.15rem)/1 "IBM Plex Mono", monospace;
      letter-spacing: -.065em;
      overflow-wrap: anywhere;
      font-variant-numeric: tabular-nums;
    }

    .total.bump,
    .discount-value.bump { animation: number-bump .26s ease-out; }

    @keyframes number-bump {
      0% { transform: scale(.96); opacity: .62; }
      70% { transform: scale(1.025); }
      100% { transform: scale(1); opacity: 1; }
    }

    .count { color: var(--result-muted); font-size: .78rem; }

    .discount-box {
      margin-top: 22px;
      border: 1px solid color-mix(in srgb, var(--result-ink) 20%, transparent);
      border-radius: 14px;
      overflow: hidden;
    }

    .discount-grid {
      display: grid;
      grid-template-columns: minmax(112px, .8fr) minmax(0, 1.7fr);
      align-items: stretch;
    }

    .discount-cell {
      min-width: 0;
      min-height: 106px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 17px 12px 16px;
      text-align: center;
    }

    .discount-cell + .discount-cell {
      border-left: 1px solid color-mix(in srgb, var(--result-ink) 18%, transparent);
    }

    .discount-cell label,
    .discount-cell > span {
      display: block;
      margin-bottom: 10px;
      color: var(--result-muted);
      font-size: .73rem;
      font-weight: 700;
      letter-spacing: .015em;
    }

    .discount-value {
      display: block;
      max-width: 100%;
      color: var(--result-ink);
      font: 600 clamp(1.7rem, 4.2vw, 2.35rem)/1 "IBM Plex Mono", monospace;
      letter-spacing: -.055em;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }

    .discount-cell:last-child {
      background: color-mix(in srgb, var(--result-ink) 8%, transparent);
    }

    .percent-input-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 3px;
    }

    .percent-input {
      width: 48px;
      height: 30px;
      padding: 0 4px;
      border: 0;
      border-bottom: 1px solid color-mix(in srgb, var(--result-ink) 46%, transparent);
      border-radius: 0;
      outline: 0;
      background: transparent;
      color: var(--result-ink);
      font: 600 1rem/1 "IBM Plex Mono", monospace;
      text-align: center;
      appearance: textfield;
    }

    .percent-input::-webkit-inner-spin-button,
    .percent-input::-webkit-outer-spin-button { appearance: none; margin: 0; }
    .percent-input:focus { border-color: var(--result-ink); }
    .percent-symbol { font: 600 .9rem/1 "IBM Plex Mono", monospace; }

    .percent-presets {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 7px;
      padding: 9px;
      border-top: 1px solid color-mix(in srgb, var(--result-ink) 18%, transparent);
    }

    .percent-presets button {
      min-height: 34px;
      border: 0;
      border-radius: 8px;
      background: color-mix(in srgb, var(--result-ink) 9%, transparent);
      color: var(--result-ink);
      font: 600 .76rem/1 "IBM Plex Mono", monospace;
      cursor: pointer;
    }

    .percent-presets button[aria-pressed="true"] {
      background: var(--result-ink);
      color: var(--result);
    }

    .result-actions {
      display: grid;
      grid-template-columns: 1fr;
      gap: 9px;
      margin-top: 22px;
    }

    .result-actions button {
      min-height: 44px;
      border-radius: 10px;
      border: 1px solid color-mix(in srgb, var(--result-ink) 22%, transparent);
      background: transparent;
      color: var(--result-ink);
      font-weight: 600;
      font-size: .82rem;
      cursor: pointer;
    }

    .result-actions .primary {
      background: var(--result-ink);
      color: var(--result);
      border-color: var(--result-ink);
    }

    .breakdown {
      flex: 1;
      border-top: 1px dashed color-mix(in srgb, var(--result-ink) 24%, transparent);
      padding: 18px 12px 12px;
    }

    .breakdown-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px 12px;
      color: var(--result-muted);
      font-size: .8rem;
      font-weight: 600;
      letter-spacing: .01em;
    }

    .breakdown-head span:first-child {
      color: var(--result-ink);
      font-size: .84rem;
      font-weight: 700;
    }

    .items {
      display: grid;
      gap: 3px;
      max-height: 330px;
      overflow: auto;
      overscroll-behavior: contain;
      scrollbar-width: thin;
    }

    .item {
      width: 100%;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 14px;
      padding: 10px 12px;
      border: 0;
      border-radius: 9px;
      background: transparent;
      color: var(--result-ink);
      text-align: left;
      cursor: pointer;
    }
    .item:hover, .item:focus-visible { background: color-mix(in srgb, var(--result-ink) 9%, transparent); outline: none; }
    .item.excluded { opacity: .46; }
    .item.excluded .item-value { text-decoration: line-through; }
    .item-source {
      min-width: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--result-muted);
      font-size: .76rem;
    }
    .item-value {
      font: 500 .84rem/1.2 "IBM Plex Mono", monospace;
      font-variant-numeric: tabular-nums;
    }

    .empty {
      padding: 28px 14px 34px;
      text-align: center;
      color: var(--result-muted);
      font-size: .82rem;
      line-height: 1.65;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: max(22px, env(safe-area-inset-bottom));
      translate: -50% 14px;
      z-index: 10;
      padding: 10px 14px;
      border-radius: 9px;
      background: var(--ink);
      color: var(--bg);
      box-shadow: var(--shadow);
      font-size: .8rem;
      opacity: 0;
      pointer-events: none;
      transition: opacity .18s, translate .18s;
    }
    .toast.show { opacity: 1; translate: -50% 0; }

    @media (max-width: 820px) {
      .page { padding: 22px 14px 34px; }
      .intro { display: block; margin-bottom: 18px; padding: 5px 4px 0; }
      .intro h1 { font-size: clamp(32px, 9.5vw, 51.2px); }
      .hero-result { width: 100%; margin-top: 18px; }
      .workspace { grid-template-columns: 1fr; }
      .result-panel { position: static; grid-row: 1; }
      .input-panel { grid-row: 2; }
      textarea { min-height: 300px; }
      .items { max-height: 250px; }
    }

    @media (max-width: 500px) {
      .panel-head { flex-wrap: wrap; }
      .panel-head h2 { margin-right: auto; }
      .result-actions { grid-template-columns: 1fr; }
      .total-block { padding: 23px 20px 19px; }
      .breakdown { padding-inline: 8px; }
    }

    .cursor-cat {
      position: fixed;
      top: 0;
      left: 0;
      z-index: 30;
      width: 46px;
      height: 34px;
      color: var(--cat);
      pointer-events: none;
      opacity: 0;
      transform: translate3d(-60px, -60px, 0);
      transition: opacity .16s ease;
      will-change: transform;
      filter: drop-shadow(0 4px 3px rgba(20, 28, 22, .18));
    }

    .cursor-cat.visible { opacity: 1; }
    .cat-sprite { width: 100%; height: 100%; overflow: visible; transform-origin: center; }
    .cursor-cat.facing-left .cat-sprite { transform: scaleX(-1); }
    .cat-body, .cat-head, .cat-tail, .cat-leg { fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; }
    .cat-body, .cat-head { fill: currentColor; }
    .cat-tail { stroke-width: 4; }
    .cat-leg { stroke-width: 4.5; transform-box: fill-box; transform-origin: top; }
    .cat-face { fill: var(--cat-detail); }
    .cat-shadow { fill: rgba(18, 32, 23, .16); }
    .cursor-cat.running .cat-tail { animation: cat-tail .34s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: right center; }
    .cursor-cat.running .leg-a { animation: cat-step-a .26s ease-in-out infinite alternate; }
    .cursor-cat.running .leg-b { animation: cat-step-b .26s ease-in-out infinite alternate; }

    @keyframes cat-tail { to { transform: rotate(-12deg); } }
    @keyframes cat-step-a { to { transform: rotate(20deg); } }
    @keyframes cat-step-b { to { transform: rotate(-20deg); } }

    @media (pointer: coarse) { .cursor-cat { display: none; } }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; }
      .cursor-cat.running .cat-tail,
      .cursor-cat.running .cat-leg { animation: none !important; }
    }
  </style>

  <meta name="theme-color" content="#126a46">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Hiệu Tính Tổng">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-192.png">

</head>
<body>
  <main class="page">
    <header class="intro">
      <h1>Hiệu Ví Trả Sau 0349722108</h1>
      <output class="hero-result" id="heroDiscounted" aria-label="Kết quả sau khi trừ phần trăm" hidden></output>
    </header>

    <section class="workspace" aria-label="Công cụ tính tổng">
      <article class="panel input-panel">
        <div class="panel-head">
          <h2>Nội dung cần tính</h2>
          <div class="panel-head-actions">
            <button class="text-btn" id="clearBtn" type="button">Xóa hết</button>
          </div>
        </div>

        <textarea id="source" spellcheck="false" aria-label="Nhập nội dung cần tính tổng" placeholder="Ví dụ:&#10;Cà phê 35.000đ&#10;Bánh mì 2 × 25k&#10;Giảm giá -10.000&#10;&#10;Nhập văn bản bất kỳ vào đây…"></textarea>
      </article>

      <aside class="panel result-panel" aria-live="polite">
        <div class="total-block">
          <div class="total-label">
            <span>TỔNG</span>
            <div class="auto-tools">
              <span class="live-dot">Tự động</span>
              <button class="copy-orders-btn" id="copyOrdersBtn" type="button" disabled>Sao chép đơn</button>
            </div>
          </div>
          <div class="total" id="total">0</div>
          <div class="count" id="count">Chưa tìm thấy khoản nào</div>

          <div class="discount-box" aria-label="Tính kết quả sau khi trừ phần trăm">
            <div class="discount-grid">
              <div class="discount-cell">
                <label for="discountInput">TRỪ</label>
                <div class="percent-input-wrap">
                  <input class="percent-input" id="discountInput" type="number" min="0" max="100" step="0.1" inputmode="decimal" value="6" aria-label="Phần trăm cần trừ">
                  <span class="percent-symbol">%</span>
                </div>
              </div>
              <div class="discount-cell">
                <span>KẾT QUẢ LÀM TRÒN</span>
                <strong class="discount-value" id="discountedTotal">0k</strong>
              </div>
            </div>
            <div class="percent-presets" aria-label="Chọn nhanh phần trăm">
              <button type="button" data-percent="6" aria-pressed="true">6%</button>
              <button type="button" data-percent="7" aria-pressed="false">7%</button>
              <button type="button" data-percent="8" aria-pressed="false">8%</button>
              <button type="button" data-percent="9" aria-pressed="false">9%</button>
            </div>
          </div>

          <div class="result-actions">
            <button class="primary" id="copyBtn" type="button">Sao chép kết quả</button>
          </div>
        </div>

        <div class="breakdown">
          <div class="items" id="items"></div>
          <div class="empty" id="empty">Các con số được nhận diện sẽ hiện ở đây để bạn kiểm tra.</div>
        </div>
      </aside>
    </section>
  </main>

  <div class="cursor-cat" id="cursorCat" aria-hidden="true">
    <svg class="cat-sprite" viewBox="0 0 48 34" focusable="false" aria-hidden="true">
      <ellipse class="cat-shadow" cx="25" cy="31" rx="17" ry="2.5" />
      <path class="cat-tail" d="M12 21 C4 24 2 17 7 13" />
      <ellipse class="cat-body" cx="24" cy="21" rx="14" ry="8" />
      <path class="cat-leg leg-a" d="M18 25 L16 31" />
      <path class="cat-leg leg-b" d="M29 25 L32 31" />
      <circle class="cat-head" cx="37" cy="15" r="8" />
      <path class="cat-head" d="M31 11 L32 4 L37 9 M39 8 L44 4 L44 12" />
      <circle class="cat-face" cx="39.5" cy="14" r="1.25" />
      <path d="M44 17 L47 18 M43.5 19 L47 21" fill="none" stroke="var(--cat-detail)" stroke-width="1" stroke-linecap="round" />
    </svg>
  </div>
  <div class="toast" id="toast" role="status"></div>

  <script>
    (function () {
      'use strict';

      var source = document.getElementById('source');
      var totalEl = document.getElementById('total');
      var countEl = document.getElementById('count');
      var itemsEl = document.getElementById('items');
      var emptyEl = document.getElementById('empty');
      var clearBtn = document.getElementById('clearBtn');
      var copyBtn = document.getElementById('copyBtn');
      var copyOrdersBtn = document.getElementById('copyOrdersBtn');
      var discountInput = document.getElementById('discountInput');
      var discountedTotalEl = document.getElementById('discountedTotal');
      var heroDiscountedEl = document.getElementById('heroDiscounted');
      var toastEl = document.getElementById('toast');
      var mode = 'smart';
      var entries = [];
      var currentDiscounted = 0;
      var currentTotal = 0;
      var currentOrderCount = 0;
      var currentHasMoney = false;
      var excluded = {};
      var toastTimer;
      var previousTotalText = '';
      var previousDiscountText = '';
      var cursorCat = document.getElementById('cursorCat');
      var catTargetX = -60;
      var catTargetY = -60;
      var catX = -60;
      var catY = -60;
      var catFrame = 0;
      var catStopTimer;
      var reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');

      function moveCat() {
        var easing = reducedMotion.matches ? 1 : .2;
        catX += (catTargetX - catX) * easing;
        catY += (catTargetY - catY) * easing;
        cursorCat.style.transform = 'translate3d(' + catX.toFixed(1) + 'px,' + catY.toFixed(1) + 'px,0)';
        if (Math.abs(catTargetX - catX) > .2 || Math.abs(catTargetY - catY) > .2) {
          catFrame = window.requestAnimationFrame(moveCat);
        } else {
          catFrame = 0;
        }
      }

      document.addEventListener('pointermove', function (event) {
        if (event.pointerType && event.pointerType !== 'mouse') return;
        var nextX = Math.max(4, Math.min(window.innerWidth - 50, event.clientX - 38));
        var nextY = Math.max(4, Math.min(window.innerHeight - 38, event.clientY + 9));
        if (catX > -50) cursorCat.classList.toggle('facing-left', nextX < catTargetX);
        catTargetX = nextX;
        catTargetY = nextY;
        cursorCat.classList.add('visible', 'running');
        window.clearTimeout(catStopTimer);
        catStopTimer = window.setTimeout(function () { cursorCat.classList.remove('running'); }, 150);
        if (!catFrame) catFrame = window.requestAnimationFrame(moveCat);
      });

      document.addEventListener('mouseout', function (event) {
        if (!event.relatedTarget) cursorCat.classList.remove('visible', 'running');
      });

      function parseNumber(raw) {
        var text = raw.toLowerCase().trim();
        var negative = /^\s*-/.test(text) || (/^\s*\(/.test(text) && /\)\s*(?:đ|₫|vnd)?\s*$/.test(text));
        var multiplier = 1;

        if (/(?:tỷ|ty)\s*(?:vnd|đ|₫)?\s*$/i.test(text)) multiplier = 1000000000;
        else if (/(?:triệu|tr|m)\s*(?:vnd|đ|₫)?\s*$/i.test(text)) multiplier = 1000000;
        else if (/(?:nghìn|ngàn|k)\s*(?:vnd|đ|₫)?\s*$/i.test(text)) multiplier = 1000;

        var cleaned = text
          .replace(/[()\s]/g, '')
          .replace(/[+\-]/g, '')
          .replace(/(?:vnd|đ|₫|tỷ|ty|triệu|tr|nghìn|ngàn|k|m)$/i, '')
          .replace(/[^\d.,]/g, '');

        if (!cleaned || !/\d/.test(cleaned)) return null;

        var dot = cleaned.lastIndexOf('.');
        var comma = cleaned.lastIndexOf(',');
        var decimalSep = null;

        if (dot >= 0 && comma >= 0) {
          var last = Math.max(dot, comma);
          var trailingBoth = cleaned.length - last - 1;
          if (trailingBoth > 0 && trailingBoth <= 2) decimalSep = cleaned[last];
        } else if (dot >= 0 || comma >= 0) {
          var sep = dot >= 0 ? '.' : ',';
          var parts = cleaned.split(sep);
          var trailing = parts[parts.length - 1].length;
          if (parts.length === 2) {
            if (trailing !== 3 || parts[0] === '0') decimalSep = sep;
          } else {
            var grouping = parts.slice(1).every(function (part) { return part.length === 3; });
            if (!grouping && trailing <= 2) decimalSep = sep;
          }
        }

        var normalized;
        if (decimalSep) {
          var idx = cleaned.lastIndexOf(decimalSep);
          normalized = cleaned.slice(0, idx).replace(/[.,]/g, '') + '.' + cleaned.slice(idx + 1).replace(/[.,]/g, '');
        } else {
          normalized = cleaned.replace(/[.,]/g, '');
        }

        var value = Number(normalized) * multiplier;
        if (!Number.isFinite(value)) return null;
        return negative ? -value : value;
      }

      function tokenPattern() {
        return /[-+]?\s*\(?\s*\d[\d.,]*\s*\)?\s*(?:tỷ|ty|triệu|tr|nghìn|ngàn|k|m|vnd|đ|₫)?(?=\s*(?:$|[^\p{L}\d.,]))/giu;
      }

      function isMoneyMarked(raw) {
        return /(?:tỷ|ty|triệu|tr|nghìn|ngàn|k|m|vnd|đ|₫)\s*$/i.test(raw.trim());
      }

      function stripSmartNoise(line) {
        return line
          .replace(/\b\d{1,2}[\/\-.]\d{1,2}[\/\-.]\d{2,4}\b/g, ' ')
          .replace(/\b\d{1,2}:\d{2}(?::\d{2})?\b/g, ' ')
          .replace(/(?:\+?84|0)(?:[ .-]?\d){8,10}\b/g, ' ')
          .replace(/[-+]?\s*\d+(?:[.,]\d+)?\s*%/g, ' ');
      }

      function extract(text) {
        var result = [];
        var lines = text.split(/\r?\n/);

        lines.forEach(function (original, lineIndex) {
          var line = original.trim();
          if (!line) return;
          var working = mode === 'smart' ? stripSmartNoise(line) : line;
          var usesTrailingValue = false;

          if (mode === 'smart' && !/(?:x|×|\*)/iu.test(working)) {
            var afterWhitespace = working.match(/^\S+\s+(.+)$/u);
            if (afterWhitespace) {
              working = afterWhitespace[1];
              usesTrailingValue = true;
            }
          }

          if (mode === 'smart' && /=/.test(working)) {
            var right = working.slice(working.lastIndexOf('=') + 1);
            var rightMatches = right.match(tokenPattern()) || [];
            if (rightMatches.length) working = right;
          }

          if (mode === 'smart') {
            var multiply = /([-+]?\s*\(?\s*\d[\d.,]*\s*\)?\s*(?:tỷ|ty|triệu|tr|nghìn|ngàn|k|m|vnd|đ|₫)?)\s*(?:x|×|\*)\s*([-+]?\s*\(?\s*\d[\d.,]*\s*\)?\s*(?:tỷ|ty|triệu|tr|nghìn|ngàn|k|m|vnd|đ|₫)?)/giu;
            working = working.replace(multiply, function (full, left, right) {
              var a = parseNumber(left);
              var b = parseNumber(right);
              if (a !== null && b !== null) {
                result.push({
                  id: lineIndex + '-mul-' + result.length,
                  raw: full.trim(),
                  line: line,
                  value: a * b,
                  money: isMoneyMarked(left) || isMoneyMarked(right)
                });
              }
              return ' ';
            });
          }

          var matches = working.match(tokenPattern()) || [];
          matches.forEach(function (raw, tokenIndex) {
            var trimmed = raw.trim();
            var value = parseNumber(trimmed);
            if (value === null) return;
            result.push({
              id: lineIndex + '-num-' + tokenIndex,
              raw: trimmed,
              line: line,
              value: value,
              money: usesTrailingValue || isMoneyMarked(trimmed)
            });
          });
        });
        return result;
      }

      function formatNumber(value, forceCurrency) {
        var decimals = Number.isInteger(value) ? 0 : 2;
        var formatted = new Intl.NumberFormat('vi-VN', {
          minimumFractionDigits: 0,
          maximumFractionDigits: decimals
        }).format(value);
        return forceCurrency ? formatted + ' ₫' : formatted;
      }

      function formatCompactK(value) {
        return String(Math.round(value / 1000)) + 'k';
      }

      function bump(element) {
        element.classList.remove('bump');
        void element.offsetWidth;
        element.classList.add('bump');
      }

      function render() {
        entries = extract(source.value);
        var liveIds = {};
        entries.forEach(function (entry) { liveIds[entry.id] = true; });
        Object.keys(excluded).forEach(function (id) { if (!liveIds[id]) delete excluded[id]; });

        var included = entries.filter(function (entry) { return !excluded[entry.id]; });
        var total = included.reduce(function (sum, entry) { return sum + entry.value; }, 0);
        var discount = Number(String(discountInput.value).replace(',', '.'));
        if (!Number.isFinite(discount)) discount = 0;
        discount = Math.min(100, Math.max(0, discount));
        currentDiscounted = total * (1 - discount / 100);
        currentTotal = total;
        currentOrderCount = included.length;
        currentHasMoney = included.some(function (entry) { return entry.money; });
        copyOrdersBtn.disabled = included.length === 0;
        var inferredCurrency = currentHasMoney;

        var totalText = formatNumber(total, inferredCurrency);
        var discountText = formatCompactK(currentDiscounted);
        totalEl.textContent = totalText;
        discountedTotalEl.textContent = discountText;
        heroDiscountedEl.hidden = included.length === 0;
        heroDiscountedEl.textContent = included.length ? formatCompactK(currentDiscounted) : '';
        if (previousTotalText && previousTotalText !== totalText) bump(totalEl);
        if (previousDiscountText && previousDiscountText !== discountText) bump(discountedTotalEl);
        previousTotalText = totalText;
        previousDiscountText = discountText;
        document.querySelectorAll('[data-percent]').forEach(function (button) {
          button.setAttribute('aria-pressed', String(Number(button.dataset.percent) === discount));
        });
        countEl.textContent = included.length
          ? included.length + ' khoản được cộng' + (entries.length !== included.length ? ' · ' + (entries.length - included.length) + ' khoản đã bỏ' : '')
          : 'Chưa tìm thấy khoản nào';

        emptyEl.hidden = entries.length > 0;
        itemsEl.innerHTML = '';

        entries.forEach(function (entry) {
          var button = document.createElement('button');
          button.type = 'button';
          button.className = 'item' + (excluded[entry.id] ? ' excluded' : '');
          button.setAttribute('aria-pressed', String(!excluded[entry.id]));
          button.setAttribute('aria-label', (excluded[entry.id] ? 'Thêm lại ' : 'Bỏ ') + entry.raw);
          button.dataset.id = entry.id;

          var sourceSpan = document.createElement('span');
          sourceSpan.className = 'item-source';
          sourceSpan.textContent = entry.line;
          var valueSpan = document.createElement('span');
          valueSpan.className = 'item-value';
          valueSpan.textContent = formatNumber(entry.value, false);
          button.appendChild(sourceSpan);
          button.appendChild(valueSpan);
          itemsEl.appendChild(button);
        });
      }

      function showToast(message) {
        window.clearTimeout(toastTimer);
        toastEl.textContent = message;
        toastEl.classList.add('show');
        toastTimer = window.setTimeout(function () { toastEl.classList.remove('show'); }, 1700);
      }

      source.addEventListener('input', render);

      itemsEl.addEventListener('click', function (event) {
        var button = event.target.closest('.item');
        if (!button) return;
        var id = button.dataset.id;
        if (excluded[id]) delete excluded[id];
        else excluded[id] = true;
        render();
      });

      clearBtn.addEventListener('click', function () {
        source.value = '';
        excluded = {};
        render();
        source.focus();
      });

      discountInput.addEventListener('input', render);
      discountInput.addEventListener('blur', function () {
        var value = Number(String(discountInput.value).replace(',', '.'));
        if (!Number.isFinite(value)) value = 0;
        discountInput.value = String(Math.min(100, Math.max(0, value)));
        render();
      });

      document.querySelectorAll('[data-percent]').forEach(function (button) {
        button.addEventListener('click', function () {
          discountInput.value = button.dataset.percent;
          render();
        });
      });

      function copyText(value, successMessage) {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(value).then(function () { showToast(successMessage); }, function () { showToast('Không thể sao chép'); });
        } else {
          var temp = document.createElement('textarea');
          temp.value = value;
          temp.style.position = 'fixed';
          temp.style.opacity = '0';
          document.body.appendChild(temp);
          temp.select();
          var ok = document.execCommand('copy');
          temp.remove();
          showToast(ok ? successMessage : 'Không thể sao chép');
        }
      }

      copyOrdersBtn.addEventListener('click', function () {
        if (!currentOrderCount) return;
        var inputText = source.value.trim();
        var summary = currentOrderCount + ' đơn  ' + formatNumber(currentTotal, true);
        copyText(inputText + '\n' + summary, 'Đã sao chép đơn và tổng tiền');
      });

      copyBtn.addEventListener('click', function () {
        var amountText = formatCompactK(currentDiscounted);
        var value = amountText + ' đã chuyển khoản ,cảm ơn đã ủng hộ Hiệu ạ🌸';
        copyText(value, 'Đã sao chép kết quả');
      });

      render();
    })();
  </script>

<script>
if ('serviceWorker' in navigator) { window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(()=>{})); }
</script>

</body>
